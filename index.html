<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifra,My virtual assistant</title>
  <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ws-loader" class="ws-loader-overlay" aria-live="polite" aria-busy="true">
      <div class="ws-loader-content">
        <img src="logo.jpg" alt="Workseer logo" class="ws-loader-logo">
        <div class="ws-spinner" aria-hidden="true"></div>
        <p class="ws-loader-text">Loading Workseer…</p>
      </div>
    </div>
    <img src="logo.jpg" alt="logo" id="logo">
    <h1>I'm <span id="name">Shifra</span>,Your <span id="va">Virtual Assistant</span></h1>
    <img src="voice.gif" alt="voice" id="voice">
    <button id="btn"><img src="mic.svg" alt="mic"><span id="content"> Click here for talk to me</span> </button>

    <script src="script.js"></script>
</body>
</html>
